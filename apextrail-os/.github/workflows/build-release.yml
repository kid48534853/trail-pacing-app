name: Build ApexTrail OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows EXE
        shell: bash
        run: |
          npm install
          python -c "import struct, zlib; w=h=512; raw=b''.join(b'\x00'+b'\x84\xcc\x16\xff'*w for _ in range(h)); chunk=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); open('app-icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))"
          npx tauri icon app-icon.png
          npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ApexTrail-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: android-actions/setup-android@v3
      - name: Install NDK and Build APK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          npm install
          python3 -c "import struct, zlib; w=h=512; raw=b''.join(b'\x00'+b'\x84\xcc\x16\xff'*w for _ in range(h)); chunk=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); open('app-icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))"
          npx tauri icon app-icon.png
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: ApexTrail-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
