name: Build & Release Trail Pacing App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - run: flutter create --platforms=android --project-name trail_pacing_app .
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - name: Rename APK Artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk trail-pacing-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: trail-pacing-android-apk
          path: trail-pacing-android-arm64.apk

  build-windows:
    name: Build Windows Desktop Executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - run: flutter create --platforms=windows --project-name trail_pacing_app .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows Release Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath trail-pacing-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: trail-pacing-windows-x64
          path: trail-pacing-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/trail-pacing-android-apk/trail-pacing-android-arm64.apk
            artifacts/trail-pacing-windows-x64/trail-pacing-windows-x64.zip
